[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dit-mate"
version = "0.1.0"
description = "A suite of utilities for Digital Imaging Technicians and post-production workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Luis Gómez Gutiérrez" },
]
keywords = [
    "dit", "digital-imaging-technician",
    "post-production",
    "media-management",
    "diff",
    "compare",
    "verification",
    "checksum",
    "hash",
    "xxhash",
    "backup-verification",
    "directory-diff",
    "metadata",
    "video",
    "camera",
    "mediainfo",
    "exiftool",
    "xavc", "prores", "r3d", "wav", "bwf",
    "rushes-log"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

dependencies = [
    "humanize>=4.15.0",
    "platformdirs>=4.9.6",
    "xxhash>=3.7.0",
]

[project.scripts]
basicmeta = "dit_mate.basicmeta:main"
mkday = "dit_mate.mkday:main"
mrl = "dit_mate.mrl:main"
rename-roll = "dit_mate.rename_roll:main"
lifsaver = "dit_mate.lifsaver:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/dit_mate"]

[tool.hatch.build.targets.sdist]
include = ["src/dit_mate"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]

